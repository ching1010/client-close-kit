name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble landing page
        run: |
          mkdir -p _site
          if [ -d fragments ] && ls fragments/f*.html.part >/dev/null 2>&1; then
            # Prefer complete index.html over incomplete fragments
            if [ -f index.html ]; then
              cp index.html _site/
            else
              cat fragments/f*.html.part > _site/index.html
            fi
          elif [ -f index.html ]; then
            cp index.html _site/
          else
            echo "No landing content found" >&2
            exit 1
          fi
          if [ -d pngparts ]; then
            cat pngparts/p*.b64 | tr -d '\n' | base64 -d > _site/gumroad-cover.png
          elif [ -f gumroad-cover.png ]; then
            cp gumroad-cover.png _site/
          fi
          touch _site/.nojekyll
          ls -la _site
          head -c 120 _site/index.html; echo
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

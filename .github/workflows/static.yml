name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/
          if [ -d pngparts ]; then
            cat pngparts/p*.b64 | tr -d '\n' | base64 -d > _site/gumroad-cover.png
          elif [ -f gumroad-cover.png ]; then
            cp gumroad-cover.png _site/
          fi
          touch _site/.nojekyll
          ls -la _site
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true

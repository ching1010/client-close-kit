name: Publish landing cover

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Rebuild cover image
        run: |
          tr -d '\n\r' < pngparts/p*.b64 | base64 --decode > gumroad-cover.png
          test "$(stat -c%s gumroad-cover.png)" = 27178

      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish cover on gh-pages
        run: |
          cp gumroad-cover.png gh-pages/gumroad-cover.png
          cd gh-pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gumroad-cover.png
          if git diff --cached --quiet; then
            echo "Cover already up to date"
          else
            git commit -m "Add landing cover image"
            git push origin HEAD:gh-pages
          fi
